spring:
  application:
    name: mtg-torneo-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  error:
    include-message: always

app:
  security:
    jwt-secret: ${JWT_SECRET:ClaveSuperSecretaMTGTorneoMaster2026LetrasYNumerosSegurosParaJWT}
    jwt-expiration-ms: 86400000
    admin-emails:
      - "dcagua268@gmail.com"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:mtgtorneodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

